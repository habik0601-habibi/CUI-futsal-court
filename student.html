<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student · CUI Futsal Court Booking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/portal.css">
<link rel="stylesheet" href="assets/css/calendar.css">
<link rel="stylesheet" href="assets/css/demo.css">
</head>
<body>
<header class="site-header"><div class="container">
  <a class="brand" href="index.html"><img class="brand-logo" src="assets/img/logo.png" alt="COMSATS University Islamabad"><span class="brand-name">CUI Futsal Court<small>COMSATS University Islamabad · Booking System</small></span></a>
  <div class="user-chip" id="userChip"></div>
</div></header>
<main class="container page" id="app">
  <h1 class="page-title">Student portal</h1>
  <p class="page-sub">Book the futsal court. Every booking needs department and sports centre approval.</p>
  <div id="banBox"></div>
  <div class="tabbar" role="tablist">
    <button role="tab" data-tab="book">Book a slot</button>
    <button role="tab" data-tab="mine">My bookings</button>
  </div>
  <section class="tab-panel" id="tab-book">
    <div class="usage" id="usage"></div>
    <div class="card">
      <div class="cal-nav">
        <button class="btn btn-secondary btn-sm" id="prevWeek">&larr; Previous week</button>
        <h3 id="weekLabel"></h3>
        <button class="btn btn-secondary btn-sm" id="nextWeek">Next week &rarr;</button>
      </div>
      <div class="legend">
        <span><i style="background:var(--accent-soft)"></i>Open</span>
        <span><i style="background:#fff;border:1px solid var(--warn)"></i>Has requests (still open to you)</span>
        <span><i style="background:#e6eefb"></i>Confirmed (locked)</span>
        <span><i style="background:#fff;box-shadow:inset 0 0 0 2px var(--accent)"></i>Your booking</span>
        <span><i style="background:#f1f3f7"></i>Past</span>
        <span><i style="background:#f6d5d0"></i>Court closed</span>
      </div>
      <div id="calendar"></div>
    </div>
  </section>
  <section class="tab-panel" id="tab-mine"><div id="myBookings"></div></section>
</main>
<script src="src/config/app.config.js"></script>
<script src="src/services/storage.js"></script>
<script src="src/lib/time.js"></script>
<script src="src/data/form-content.js"></script>
<script src="src/lib/bookingForm.js"></script>
<script src="src/lib/engine.js"></script>
<script src="src/data/seed.js"></script>
<script src="src/services/core.js"></script>
<script src="src/services/bookingService.js"></script>
<script src="src/services/directoryService.js"></script>
<script src="src/services/banService.js"></script>
<script src="src/services/blockService.js"></script>
<script src="src/services/auditService.js"></script>
<script src="src/services/session.js"></script>
<script src="src/ui/components.js"></script>
<script src="src/ui/form-view.js"></script>
<script src="src/ui/request-form.js"></script>
<script src="src/demo/demo-mode.js"></script>
<script src="src/ui/student.js"></script>
</body>
</html>
